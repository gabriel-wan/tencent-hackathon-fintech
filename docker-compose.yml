# Config lives in each app's .env; only in-network hostnames are set here.
services:
  db:
    image: pgvector/pgvector:pg17
    env_file: backend/.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      retries: 15
    # no ports: internal only

  migrate: # same step runs before each deploy
    build: ./backend
    command: alembic upgrade head
    env_file: backend/.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    env_file: frontend/.env
    environment:
      BACKEND_SERVER_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
