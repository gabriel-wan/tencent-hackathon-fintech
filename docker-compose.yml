# Config lives in each app's .env; only in-network hostnames are set here.
services:
  db:
    # Postgres 17 with pgvector and ParadeDB's pg_search (BM25, ADR-012). The preload list is given here too
    # because a data volume created by the old pgvector image keeps its own postgresql.conf without it.
    # Only pg_search is used, but keep pg_cron: the image's init script creates it on a new volume and fails without it.
    image: paradedb/paradedb:v0.26.1-pg17
    command: postgres -c shared_preload_libraries=pg_search,pg_cron,pg_stat_statements
    env_file: backend/.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, as the other services connect: on a new volume the image's init scripts run on a temporary,
      # socket-only server that a socket check would already call healthy, and migrate then gets "connection refused".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      retries: 15
    # no ports: internal only

  migrate: # same step runs before each deploy
    build: ./backend
    command: alembic upgrade head
    env_file: backend/.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  sync:
    build: ./backend
    command: python -m app.sync --loop
    healthcheck:  # the image's check calls the web server, which this worker does not run
      test: ["CMD", "python", "-m", "app.sync", "--health"]
      interval: 30s
      timeout: 10s
    env_file: backend/.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    env_file: frontend/.env
    environment:
      BACKEND_SERVER_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
