# Test, then deploy main to the live server (docs/DEPLOYMENT.md section 8).
#
# Runs after every merge to main, and from the Actions tab ("Run workflow").
# Deploys only if every CI check (ci.yml) passes. The SSH key it uses can run nothing on the
# server except scripts/deploy/update.sh.
name: Test and deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]  # documentation-only changes don't redeploy
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never stop a deploy half-way; queue the next one instead

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml  # the same checks as every pull request

  deploy:
    needs: test
    if: github.repository == 'gabriel-wan/tencent-hackathon-fintech'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$HOST" ]; then
            echo "::warning::Deploy secrets are not set yet (docs/DEPLOYMENT.md section 8): skipping the deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's authorized_keys entry forces this key to run scripts/deploy/update.sh.
          # "Connection timed out" means the server's firewall blocks GitHub (DEPLOYMENT.md section 8).
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 "ubuntu@$HOST"

      - name: Check the live site
        run: |
          # /status renders the backend's health as <dt>Database</dt><dd ...>ok</dd>.
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 https://knowbuddy.xyz/status | grep -Eq 'Database</dt><dd[^>]*>ok</dd>'; then
              echo "Live site reports Database: ok"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://knowbuddy.xyz/status did not report Database: ok"
          exit 1
